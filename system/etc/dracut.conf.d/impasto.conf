# Fedora builds the initramfs with dracut. Arch uses the mkinitcpio drop-in
# instead, and ./setup does not copy this file there.
add_dracutmodules+=" plymouth "
install_items+=" /usr/share/plymouth/themes/impasto/impasto.plymouth "
